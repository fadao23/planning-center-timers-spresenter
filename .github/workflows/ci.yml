name: CI

on:
  push:
    branches:
      [main, develop, 'feature/**', 'fix/**', 'chore/**', 'docs/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Version consistency
        run: npm run verify:version
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests + coverage
        run: npm run test:coverage
      - name: Build + package
        run: npm run package
      # archive: false uploads the plugin zip as-is (no extra zip wrapper), so
      # the artifact downloads as the installable io.github.fadao23.pco-timers-X.Y.Z.zip
      - name: Upload plugin zip
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          path: release/*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
